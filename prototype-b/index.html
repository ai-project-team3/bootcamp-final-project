<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말로 짓는 인형극 · 초안 B — 같이 짓는 책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F1E3; --ink:#33291F; --muted:#8B7B68;
  --red:#E4572E; --yellow:#F3B61F; --teal:#2A9D8F; --navy:#264653; --pink:#E9868B;
}
*{box-sizing:border-box}
body{margin:0;background:#DED2BC;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);padding:14px}
h1,.hand{font-family:"Gaegu","Noto Sans KR",cursive}
.top{max-width:1240px;margin:0 auto 10px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;color:var(--red)}
.top .sub{font-size:12px;color:#6b5c4a}
.wrap{max-width:1240px;margin:0 auto}
.outer{width:100%;aspect-ratio:2/1;position:relative}
.phone{position:absolute;left:0;top:0;width:1200px;height:600px;transform-origin:0 0;border-radius:40px;background:#2b241c;padding:10px;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--paper);display:flex}

/* ── 왼쪽: 쌓이는 책 ─────────────────────────── */
.bookside{width:42%;background:#EFE6D2;border-right:3px dashed #cbbda3;position:relative;display:flex;flex-direction:column;padding:14px}
.bookside h2{margin:0 0 8px;font-family:"Gaegu";font-size:22px;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline}
.bookside h2 small{font-size:13px;color:var(--muted);font-family:"Noto Sans KR"}
.stack{flex:1;position:relative}
.leaf{position:absolute;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.10);
      padding:10px 12px;transition:.55s cubic-bezier(.3,.9,.4,1);transform-origin:50% 100%}
.leaf .art{height:92px;position:relative;overflow:hidden;border-radius:10px;background:#F3EDE0;margin-bottom:6px}
.leaf .art img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leaf .art img.ob{position:absolute;bottom:4px;height:76%}
.leaf .tx{font-family:"Gaegu";font-size:17px;line-height:1.25;min-height:22px}
.leaf.new{animation:drop .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateY(-50px) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
.empty{color:var(--muted);font-size:13px;text-align:center;margin-top:60px;line-height:1.8}

/* ── 오른쪽: 무대 ─────────────────────────── */
.right{width:58%;display:flex;flex-direction:column;position:relative}
.stage{flex:1;position:relative;overflow:hidden;background:#EAE0CA}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ob{position:absolute;bottom:8px;transition:.5s;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.ob.hero{left:7%;height:58%}
.ob.veh{left:36%;height:46%}
.ob.fr{right:8%;height:50%}
.ob.dn{left:60%;height:44%}
.shake{animation:shk .45s linear 3}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,3px)}75%{transform:translate(8px,-3px)}}

.dock{height:118px;display:flex;align-items:flex-end;gap:10px;padding:0 14px 12px;background:linear-gradient(180deg,rgba(247,241,227,0),var(--paper) 30%)}
.mascot{width:86px;height:86px;flex:0 0 auto}
.mascot.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
.bubble{flex:1;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:11px 14px;min-height:66px;
        font-family:"Gaegu";font-size:21px;line-height:1.3;position:relative}
.bubble .who{display:block;font-size:11px;color:var(--muted);font-family:"Noto Sans KR"}
.bubble.child{background:#FFF6D8}
.bubble.adult{background:#DFF1EC}
.mic{width:80px;height:80px;border-radius:50%;border:3px solid var(--ink);background:var(--red);color:#fff;font-size:30px;cursor:pointer;flex:0 0 auto}
.mic.on{animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(228,87,46,.5)}to{box-shadow:0 0 0 16px rgba(228,87,46,0)}}
.side{display:flex;flex-direction:column;gap:6px}
.mini{width:64px;height:36px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:14px;cursor:pointer;font-family:"Gaegu"}


/* 배경 소품 — 만질 수는 있지만 이야기를 바꾸지 않는다 */
.prop{position:absolute;will-change:transform}
.ob{z-index:4}
.touchme{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 10px rgba(255,255,255,.9))}}

/* 어른 차례 띠 */
.adultbar{position:absolute;left:0;right:0;bottom:118px;background:var(--teal);color:#fff;padding:7px 14px;
          font-family:"Gaegu";font-size:18px;display:none;align-items:center;gap:10px;z-index:9}
.adultbar.on{display:flex}
.adultbar button{border:0;border-radius:10px;padding:6px 12px;font-family:"Gaegu";font-size:16px;cursor:pointer}

/* 레이어 */
/* 레이어는 오른쪽 무대만 덮는다 — 왼쪽 책은 늘 보여야 한다 (초안 B의 핵심) */
.layer{position:absolute;left:42%;right:0;top:0;bottom:0;z-index:20;display:none;flex-direction:column;
       align-items:center;justify-content:center;gap:14px;background:rgba(247,241,227,.90);padding:10px}
.btn{font-family:"Gaegu";font-size:20px;padding:11px 22px;border-radius:14px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.btn.pri{background:var(--yellow)}
.big{font-family:"Gaegu";font-size:30px;padding:15px 34px;border-radius:20px;border:3px solid var(--ink);background:var(--red);color:#fff;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.cards{display:flex;gap:14px}
.card{width:124px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px;text-align:center;cursor:pointer}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:82px;object-fit:contain}
.card b{font-family:"Gaegu";font-size:18px;font-weight:400}
.hint{font-size:12px;color:var(--muted)}

/* 그림판 */
#pad{background:#fff;border:2px solid var(--ink);border-radius:14px;touch-action:none;cursor:crosshair}
.crayon{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);cursor:pointer}
.crayon.sel{outline:3px solid var(--red);outline-offset:2px}

/* 미션 */
.missionbar{position:absolute;left:50%;transform:translateX(-50%);top:8px;background:#fff;border:2px solid var(--ink);
            border-radius:999px;padding:5px 16px;font-family:"Gaegu";font-size:17px;z-index:8}

/* 리포트 */
.report{position:absolute;inset:0;background:#FBF7EC;overflow:auto;z-index:25;padding:16px 22px;font-size:13.5px;display:none}
.report h2{margin:0 0 4px;font-size:22px;color:var(--red);font-family:"Gaegu"}
.rgrid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:8px}
.axline{display:flex;align-items:center;gap:7px;background:#fff;border-radius:10px;padding:6px 9px;margin-bottom:5px}
.axline b{width:92px;font-family:"Gaegu";font-weight:400}
.dots span{color:#ddd;margin-right:1px}.dots span.on{color:var(--red)}
.q{color:var(--muted);font-size:12px;flex:1}
.pie{width:140px;height:140px;border-radius:50%}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px;border-top:1px solid #e6dccd;padding-top:7px}

/* 서랍 */
#hot{position:absolute;right:0;top:0;width:64px;height:64px;z-index:30}
.drawer{position:absolute;right:0;top:0;bottom:0;width:330px;background:rgba(30,25,20,.96);color:#f2e9dc;z-index:40;
        transform:translateX(100%);transition:.3s;overflow:auto;padding:12px;font-size:12.5px}
.drawer.open{transform:none}
.drawer h3{margin:8px 0 5px;font-size:14px;color:var(--yellow)}
.drawer button{font-size:11.5px;padding:5px 9px;border-radius:8px;border:0;background:#3c332a;color:#f2e9dc;cursor:pointer;margin:2px 2px 0 0}
.kv{display:flex;justify-content:space-between;border-bottom:1px dotted #4a4036;padding:2px 0}
.legend{font-size:11.5px;line-height:1.6;color:#c9bcab}
</style>
</head>
<body>
<div class="top">
  <h1>초안 B — 같이 짓는 책</h1>
  <span class="sub">그림체 · 책이 보이는 시점 · 어른 자리 · 턴 수를 초안 A와 다르게 잡은 비교용 초안 · 오른쪽 위 구석을 길게 누르면 시연 서랍</span>
</div>
<div class="wrap"><div class="outer" id="outer">
<div class="phone" id="phone"><div class="screen" id="screen">

  <!-- 왼쪽: 쌓이는 책 -->
  <div class="bookside">
    <h2><span>우리 책</span><small id="pgn">0쪽</small></h2>
    <div class="stack" id="stack">
      <div class="empty" id="emptyMsg">아직 빈 책이야.<br>말하면 한 쪽씩 생겨!</div>
    </div>
  </div>

  <!-- 오른쪽: 무대 -->
  <div class="right">
    <div class="stage" id="stage"><img class="bg" id="bg" src="assets/bg_start.png" alt=""></div>
    <div class="adultbar" id="abar"></div>
    <div class="dock">
      <img class="mascot talk" id="mas" src="assets/mascot.png" alt="">
      <div class="bubble" id="bub"><span class="who">마스코트</span><span id="bt"></span></div>
      <button class="mic" id="mic">🎤</button>
      <div class="side">
        <button class="mini" id="skip">➡️</button>
        <button class="mini" id="draw">🖍️</button>
      </div>
    </div>
  </div>

  <div class="layer" id="layer"></div>
  <div class="report" id="rep"></div>
  <div id="hot"></div>
  <div class="drawer" id="drawer"></div>
</div></div></div>

<script>
/* ═══════════════════════════════════════════════════════════
   초안 B — 같이 짓는 책
   초안 A(안치영 데모 / prototype/)와 일부러 다르게 잡은 것 넷
     1. 그림체  : 찢은 색종이 콜라주 (SDXL) ↔ A는 펠트 3D (krea2 turbo)
     2. 책      : 대화 중에 왼쪽에서 한 쪽씩 쌓임 ↔ A는 마지막에 한 번에
     3. 어른    : 어른이 답해야 넘어가는 자리 1개 + 부르는 자리 1개 ↔ A는 1개(건너뛸 수 있음)
     4. 턴 수   : 5턴 ↔ A는 8턴
   같게 둔 것(비교를 위해): 미션 2개 · 부모 리포트 6축 · 가로 화면 · 열린 질문
   ═══════════════════════════════════════════════════════════ */

const A = n => `assets/${n}.png`;

/* ── 흰 배경 빼기 ───────────────────────────────
   초안 A는 BiRefNet으로 배경을 뺐다. 초안 B는 모델을 더 받지 않으려고
   흰 바탕에 그린 뒤 브라우저에서 흰색을 알파로 바꾼다. 가장자리는 부드럽게 남긴다. */
function whiteKey(img){
  if(img.dataset.keyed) return;
  try{
    const c=document.createElement('canvas');
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    if(!c.width) return;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(img,0,0);
    const d=x.getImageData(0,0,c.width,c.height), p=d.data;
    for(let i=0;i<p.length;i+=4){
      const m=Math.min(p[i],p[i+1],p[i+2]);
      if(m>243) p[i+3]=0;
      else if(m>219) p[i+3]=Math.round((243-m)/24*255);
    }
    x.putImageData(d,0,0);
    img.dataset.keyed='1';
    img.src=c.toDataURL();
  }catch(e){}
}
/* 지금은 쓰지 않는다 — tools/cutout.py가 미리 잘라 RGBA로 저장하기 때문이다.
   (켜 두면 인형 안쪽의 흰 부분까지 뚫린다. 안경알·새 배 같은 곳)
   렌더만 하고 cutout을 안 돌렸을 때만 아래 줄의 주석을 푼다. */
// document.addEventListener('load', e=>{ const t=e.target;
//   if(t.tagName==='IMG' && /assets\//.test(t.src) && !/assets\/bg_/.test(t.src)) whiteKey(t); }, true);

const $ = s => document.querySelector(s);

function fit(){ const o=$('#outer'), k=o.clientWidth/1200;
  $('#phone').style.transform=`scale(${k})`; o.style.height=(600*k)+'px'; }
addEventListener('resize',fit); fit();

/* 그림이 아직 없을 때 자리만 잡아둔다 */
document.addEventListener('error', e=>{
  if(e.target.tagName==='IMG'){ e.target.style.visibility='hidden'; }
}, true);

const S = {
  hero:'hero_a', place:null, problem:null, friend:null, reason:null, solution:null,
  dino:null, friendName:null, title:null, drawing:null,
  s1:0, s2:0, level:'이어 짓기', adultTurns:0, answers:[], events:[], pages:[], friendsMet:[]
};
const PLACE = {
  space:{n:'우주', bg:'bg_space', v:'rocket', vn:'로켓', ev:'로켓이 흔들려'},
  sea:  {n:'바닷속', bg:'bg_sea',  v:'turtle', vn:'거북이', ev:'거북이가 휘청휘청해'},
  dino: {n:'공룡 나라', bg:'bg_dino', v:'train', vn:'기차', ev:'기차가 덜컹거려'}
};

function ev(type,d={}){ S.events.push({type,...d}); const l=$('#log');
  if(l) l.insertAdjacentHTML('afterbegin',`<div>${type} ${JSON.stringify(d).slice(0,60)}</div>`); }

/* ── 말하기 ── */
let typer;
function say(t, who='마스코트', cls=''){
  const b=$('#bub'); b.className='bubble '+cls;
  b.innerHTML=`<span class="who">${who}</span><span id="bt"></span>`;
  const el=b.querySelector('#bt'); let i=0; clearInterval(typer);
  typer=setInterval(()=>{ el.textContent=t.slice(0,++i); if(i>=t.length) clearInterval(typer); },20);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* 받침에 따라 조사를 고른다 — "기차을" 같은 말이 아이에게 읽히면 안 된다 */
function josa(w, a, b){            // a = 받침 있을 때, b = 없을 때
  const c = w.charCodeAt(w.length-1);
  if(c < 0xAC00 || c > 0xD7A3) return b;
  return ((c - 0xAC00) % 28) ? a : b;
}
const eul = w => w + josa(w,'을','를');

async function turn3(a,b,c){ say(a); await wait(1000); if(b){ say(b); await wait(1300);} say(c); }

/* ── 책에 한 쪽 붙이기 (초안 B의 핵심) ── */
function addPage(text, art){
  S.pages.push({text,art});
  const st=$('#stack'); const em=$('#emptyMsg'); if(em) em.remove();  // 첫 쪽에서만 있다
  st.innerHTML = S.pages.map((p,i)=>{
    const top = i===S.pages.length-1;
    const off = (S.pages.length-1-i);
    const bgSrc = p.art?.bg ? `<img class="bg" src="${A(p.art.bg)}">` : '';
    const obs = (p.art?.obs||[]).map((o,j)=>`<img class="ob" src="${o.src||A(o)}" style="left:${8+j*30}%">`).join('');
    return `<div class="leaf ${top?'new':''}" style="
        top:${Math.max(0, off*-4)}px; z-index:${i};
        transform:translateY(${off*46}px) scale(${1-off*0.015});
        opacity:${off>4?0:1 - off*0.06}">
      <div class="art">${bgSrc}${obs}</div>
      <div class="tx">${p.text}</div></div>`;
  }).reverse().join('');
  $('#pgn').textContent = S.pages.length + '쪽';
  ev('page_added',{n:S.pages.length});
}

/* ── 질문 엔진 ── */
let Q=null, micOn=false, na=0;
function ask(q){ Q=q; na=0; $('#draw').style.display=q.noDraw?'none':''; say(q.text); }
$('#mic').onclick=()=>{ if(!Q)return; micOn=!micOn; $('#mic').classList.toggle('on',micOn);
  if(!micOn){ const c=Q.cands[Math.floor(Math.random()*Q.cands.length)]; answer(c,'말로'); } };
$('#skip').onclick=()=>{ if(Q) naFlow(); };
$('#draw').onclick=()=>{ if(Q) openPad(()=>answer({t:'(직접 그림)'},'그려서')); };

async function answer(c,mode){
  micOn=false; $('#mic').classList.remove('on');
  const q=Q; Q=null;
  S.answers.push({mode,text:c.t});
  ev('utterance',{text:c.t,mode});
  if(c.sig){ if(c.sig.includes('S1'))S.s1++; if(c.sig.includes('S2'))S.s2++; ev('signal',{sig:c.sig}); }
  if(c.emo) ev('emotion_mention',{emo:c.emo});
  say(c.t,'아이','child'); await wait(850);
  const n=S.s1+S.s2; S.level = n>=4?'까닭 짓기':n>=2?'이어 짓기':'고르며 짓기';
  paintDrawer();
  await q.on(c);
}
async function naFlow(){
  const q=Q; na++;
  if(na===1&&q.easy){ say(q.easy); Q=q; return; }
  Q=null;
  const cs=(q.cards||q.cands.slice(0,3));
  say('이 중에 골라 볼까?');
  showCards(cs.map(c=>({img:c.img,label:c.t,on:()=>answer(c,'골라서')})));
}
function showCards(items){
  const L=$('#layer'); L.style.display='flex';
  L.innerHTML=`<div class="cards">${items.map((it,i)=>
    `<div class="card" data-i="${i}"><img src="${A(it.img)}"><b>${it.label}</b></div>`).join('')}</div>`;
  L.querySelectorAll('.card').forEach(el=>el.onclick=()=>{ L.style.display='none'; items[+el.dataset.i].on(); });
}
function showLayer(html){ const L=$('#layer'); L.style.display='flex'; L.innerHTML=html; }
function hideLayer(){ $('#layer').style.display='none'; $('#layer').innerHTML=''; }


/* ══════════════════════════════════════════════════════════
   배경 소품 배치기

   소품은 14종뿐이다. 세계마다 새로 만들지 않고 **배치로** 다르게 보이게 한다.
   붙여넣은 티를 없애는 규칙 일곱:
     1. 깊이 세 띠  — 멀수록 작고 흐리고 채도가 낮다
     2. 빈 자리     — 칸의 3할쯤은 일부러 비운다. 고르게 놓으면 인공적이다
     3. 좌우 뒤집기 · 기울이기 ±7°
     4. 색 흔들기   — 색상 ±12°, 밝기 ±6%
     5. 무리 짓기   — 가끔 옆에 작은 것을 하나 더 붙인다
     6. 같은 소품은 한 띠에 3번까지
     7. 세계마다 씨앗 고정 — 같은 세계를 다시 열면 같은 배치라야 "내 세계"가 된다
   ══════════════════════════════════════════════════════════ */
const WORLD_PROPS = {
  space:{ tint:'saturate(.9) hue-rotate(-6deg)',
    far:['sp_star','sp_star','sp_star','sp_planet','sp_moon'], mid:['sp_rock_l','sp_tower'], near:['sp_rock_s','sp_rock_l'] },
  sea:{ tint:'saturate(1.05) hue-rotate(10deg)',
    far:['sp_weed','sp_star'], mid:['sp_rock_l','sp_weed'], near:['sp_rock_s','sp_grass'] },
  dino:{ tint:'saturate(1) hue-rotate(0deg)',
    far:['sp_cloud','sp_bird'], mid:['sp_tree','sp_bush'], near:['sp_grass','sp_rock_s','sp_bunny'] },
  snow:{ tint:'saturate(.25) brightness(1.12)',
    far:['sp_cloud','sp_star'], mid:['sp_tree','sp_house'], near:['sp_rock_s','sp_bush'] }
};
const BANDS = [
  {k:'far',  yA:12, yB:34, sA:.30, sB:.46, op:.55, sat:.6, blur:.7, z:1, slots:7},
  {k:'mid',  yA:34, yB:56, sA:.48, sB:.68, op:.85, sat:.85, blur:.2, z:2, slots:5},
  {k:'near', yA:58, yB:84, sA:.78, sB:1.10, op:1,   sat:1,   blur:0,  z:3, slots:4}
];
function rngFrom(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

function scatter(world){
  const cfg = WORLD_PROPS[world]; const st=$('#stage');
  st.querySelectorAll('.prop').forEach(e=>e.remove());
  if(!cfg) return;
  const rnd = rngFrom(hashStr(world));
  const put1 = (name,x,y,s,b)=>{
    const im=document.createElement('img'); im.className='prop'; im.src=A(name);
    const flip = rnd()<.5?-1:1, rot=(rnd()*14-7).toFixed(1);
    const hue=Math.round(rnd()*24-12), bri=(0.94+rnd()*0.12).toFixed(2);
    const tf=`translate(-50%,-50%) scaleX(${flip}) rotate(${rot}deg)`;
    im.style.cssText=`left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;height:${(s*26).toFixed(1)}%;`+
      `transform:${tf};opacity:${b.op};z-index:${b.z};cursor:pointer;`+
      `filter:${cfg.tint} saturate(${b.sat}) brightness(${bri}) hue-rotate(${hue}deg) blur(${b.blur}px)`;
    im.onclick=()=>im.animate([{transform:tf},{transform:tf+' translateY(-9px)'},{transform:tf}],{duration:400});
    st.appendChild(im);
  };
  BANDS.forEach(b=>{
    const pool=cfg[b.k]||[]; if(!pool.length) return;
    const used={}; const w=100/b.slots;
    // 아직 3번을 안 채운 소품 중에서만 고른다 (없으면 그 자리는 비운다)
    const pickable = ()=>{
      const left = pool.filter(n=>(used[n]||0) < 3);
      return left.length ? left[Math.floor(rnd()*left.length)] : null;
    };
    for(let i=0;i<b.slots;i++){
      if(rnd()<0.28) continue;                               // 2. 빈 자리
      const n=pickable(); if(!n) continue;                   // 6. 같은 소품 3번까지
      used[n]=(used[n]||0)+1;
      const x=i*w + w*(0.15+rnd()*0.7), y=b.yA+rnd()*(b.yB-b.yA), sc=b.sA+rnd()*(b.sB-b.sA);
      put1(n,x,y,sc,b);
      if(rnd()<0.30){                                        // 5. 무리 짓기
        const n2=pickable();
        if(n2){ used[n2]=(used[n2]||0)+1;
          const dx=(3+rnd()*7)*(rnd()<.5?-1:1);
          put1(n2, x+dx, y+rnd()*3, sc*(0.55+rnd()*0.3), b); }
      }
    }
  });
}

function openPad(after){
  showLayer(`<div class="row" style="align-items:center;gap:16px">
    <div style="display:flex;flex-direction:column;gap:8px">
      ${['#E4572E','#2A9D8F','#F3B61F','#264653'].map((c,i)=>
        `<div class="crayon ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}
      <div class="crayon" data-c="erase" style="background:#fff;text-align:center;line-height:44px">🧽</div>
    </div>
    <canvas id="pad" width="380" height="270"></canvas>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn pri" id="pd">다 그렸어</button>
      <button class="btn" id="ps">그리기 싫어</button>
    </div></div>`);
  const cv=$('#pad'), cx=cv.getContext('2d'); cx.lineCap=cx.lineJoin='round';
  let col='#E4572E', down=false;
  $('#layer').querySelectorAll('.crayon').forEach(c=>c.onclick=()=>{
    $('#layer').querySelectorAll('.crayon').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); col=c.dataset.c; });
  const pos=e=>{const r=cv.getBoundingClientRect(),k=380/r.width;
    return [(e.clientX-r.left)*k,(e.clientY-r.top)*k];};
  cv.onpointerdown=e=>{down=true;cx.beginPath();cx.moveTo(...pos(e));};
  cv.onpointermove=e=>{ if(!down)return;
    cx.strokeStyle=col==='erase'?'#fff':col; cx.lineWidth=col==='erase'?30:11;
    cx.lineTo(...pos(e)); cx.stroke(); };
  addEventListener('pointerup',()=>down=false);
  $('#pd').onclick=()=>{ S.drawing=cv.toDataURL(); ev('make',{what:'draw'}); hideLayer(); after(); };
  $('#ps').onclick=()=>{ hideLayer(); after(); };
}

  put('veh',p.v);

  bar.textContent=`큰일이야, ${p.vn}에 불이 났어! 손가락으로 슥슥 문질러 줘!`;
  $('#stage').appendChild(bar);
  ev('mission',{n:1,kind:'문지르기',state:'start'});
  const fires=[[28,52],[44,60],[58,48]].map(([x,y])=>{
    const f=document.createElement('img'); f.src=A('prop_fire');
    f.style.cssText=`position:absolute;left:${x}%;top:${y}%;height:20%`;
    f.dataset.hp='3'; $('#stage').appendChild(f); return f; });
  let done=0;
  $('#stage').onpointermove=e=>{
    fires.forEach(f=>{
      if(f.dataset.hp==='0')return;
      const r=f.getBoundingClientRect();
      if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){
        const hp=+f.dataset.hp-1; f.dataset.hp=hp; f.style.height=(20*hp/3+4)+'%';
        if(hp===0){ f.src=A('prop_smoke'); setTimeout(()=>f.style.opacity='0',500);
          if(++done===3){ bar.textContent='불을 다 껐어! 대단해!';
            ev('mission',{n:1,state:'success'}); setTimeout(mission2,1400); } }
      }});
  };

          <span style="display:block;margin-top:6px">고르기도 이야기를 짓는 방법이에요.</span></div></div>
      <h3 style="font-size:14px;margin:14px 0 5px">다음에 이렇게 물어보세요</h3>
      <div class="legend" style="color:#8B7B68">· "${S.friendName||'친구'}는 어떻게 집에 갔을까?"<br>· "그때 지호 마음은 어땠어?"</div>
      <div class="note">놀이 대화 요약이며 언어발달 평가·진단이 아닙니다. 본 제품은 의료기기가 아니므로 질병 유무를 판단할 수 없으며,
        질병 유무 판단을 위해서는 의사의 검진이 필요합니다. 궁금한 점은 영유아건강검진(K-DST)이나 언어재활사와 상담하세요.</div>
      <button class="btn" style="margin-top:8px" onclick="location.reload()">처음부터 다시</button>
    </div></div>`;
}

/* ══ 시연 서랍 ══ */
let hT;
$('#hot').onpointerdown=()=>{ hT=setTimeout(()=>$('#drawer').classList.add('open'),900); };
$('#hot').onpointerup=()=>clearTimeout(hT);
function paintDrawer(){ buildDrawer(); }
function buildDrawer(){
  $('#drawer').innerHTML=`
  <button style="float:right" onclick="document.getElementById('drawer').classList.remove('open')">닫기 ✕</button>
  <h3>초안 A와 다르게 잡은 것</h3>
  <div class="legend">
    1. 그림체 — 찢은 색종이 콜라주 (SDXL) ↔ A는 펠트 3D<br>
    2. 책 — 말할 때마다 왼쪽에 한 쪽씩 쌓임 ↔ A는 마지막에 한 번에<br>
    3. 어른 — <b>답해야 넘어가는 자리 1개</b> + 마무리 자리 1개 ↔ A는 건너뛸 수 있는 1개<br>
    4. 턴 — 5턴 ↔ A는 8턴
  </div>
  <h3>같게 둔 것 (비교 변인 통제)</h3>
  <div class="legend">미션 2개 · 부모 리포트 6축 · 가로 화면 · 열린 질문 · 답 후보 5개</div>
  <h3>상태</h3>
  <div class="kv"><span>수준</span><b>${S.level}</b></div>
  <div class="kv"><span>신호 S1 / S2</span><b>${S.s1} / ${S.s2}</b></div>
  <div class="kv"><span>말한 횟수</span><b>${S.events.filter(e=>e.type==='utterance').length}</b></div>
  <div class="kv"><span>어른 차례</span><b>${S.adultTurns}</b></div>
  <div class="kv"><span>쌓인 쪽</span><b>${S.pages.length}</b></div>
  <h3>장면 이동</h3>
  <button onclick="start()">처음</button>
  <button onclick="demo();missions()">미션</button>
  <button onclick="demo();report()">리포트</button>
  <h3>없는 것</h3>
  <div class="legend">음성 인식 · LLM 호출 · 실시간 생성 · 저장 · 결제</div>
  <h3>로그</h3><div id="log" style="font-family:monospace;font-size:10.5px;max-height:150px;overflow:auto;background:#241e18;padding:6px;border-radius:6px"></div>`;
}
function demo(){
  S.place=S.place||'space'; S.friendName=S.friendName||'뿌뿌'; S.friend=S.friend||'nc_alien';
  S.reason=S.reason||'친구가 없어서 심심했어'; S.solution=S.solution||'같이 별을 땄어요';
  S.title=S.title||'지호랑 뿌뿌랑 우주 놀이';
  if(!S.answers.length) S.answers=[{mode:'말로',text:'우주!'},{mode:'말로',text:'외계인이 흔들어서!'}];
}
buildDrawer();
start();
</script>
