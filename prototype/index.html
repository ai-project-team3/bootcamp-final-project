<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말로 짓는 인형극 · HTML 초안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E1; --sun:#F9B233; --orange:#F58220; --coral:#F25C4C; --ink:#3F3126; --muted:#8A7A6A;
  --card:#fff; --green:#86C77D; --blue:#63B3ED; --pink:#F8A5C2; --r:26px;
}
*{box-sizing:border-box}
body{margin:0;background:#EFE0C8;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);padding:14px}
h1,h2,h3,.jua,button{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
.top{max-width:1240px;margin:0 auto 10px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;color:var(--orange)}
.top .sub{font-size:12px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto}
.outer{width:100%;aspect-ratio:2/1;position:relative}
.phone{position:absolute;left:0;top:0;width:1200px;height:600px;transform-origin:0 0;border-radius:42px;background:#1b1b1b;padding:10px;box-shadow:0 16px 36px rgba(0,0,0,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);font-size:18px}

/* 무대 */
.stage{position:absolute;inset:0 0 128px 0;overflow:hidden}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.actor{position:absolute;bottom:6px;height:250px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.10));transition:.5s}
.actor.hero{left:90px}
.actor.vehicle{left:330px;height:200px;animation:wob 1.6s ease-in-out infinite alternate}
.actor.friend{right:120px;height:210px}
.actor.dino{left:560px;height:190px}
@keyframes wob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.shake{animation:shk .45s linear 3}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-9px,3px)}75%{transform:translate(9px,-3px)}}

/* 별 */
.stars{position:absolute;top:12px;right:16px;z-index:8;background:rgba(255,255,255,.8);border-radius:999px;padding:6px 14px;font-family:"Jua";font-size:22px;display:flex;align-items:center;gap:6px}
.starfly{position:fixed;font-size:40px;z-index:99;pointer-events:none;transition:all .9s cubic-bezier(.3,.9,.4,1)}

/* 독 */
.dock{position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(180deg,rgba(255,244,225,0),var(--bg) 26%);display:flex;align-items:flex-end;gap:12px;padding:0 20px 14px;z-index:6}
.mascot{width:100px;height:100px;flex:0 0 auto}
.mascot.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(2deg)}}
.bubble{flex:1;background:#fff;border-radius:22px;padding:14px 18px;min-height:72px;font-size:21px;line-height:1.35;font-family:"Jua";position:relative;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.bubble:before{content:"";position:absolute;left:-11px;bottom:24px;border:11px solid transparent;border-right-color:#fff;border-left:0}
.bubble .who{display:block;font-size:12px;color:var(--muted);font-family:"Noto Sans KR"}
.bubble.child{background:#FFF0C2}.bubble.child:before{border-right-color:#FFF0C2}
.bubble.adult{background:#E8F5E9}.bubble.adult:before{border-right-color:#E8F5E9}
.mic{width:88px;height:88px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:34px;box-shadow:0 7px 0 #c94435;cursor:pointer;flex:0 0 auto}
.mic.on{background:#E0483A;animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:0 7px 0 #a93529,0 0 0 0 rgba(242,92,76,.5)}to{box-shadow:0 7px 0 #a93529,0 0 0 18px rgba(242,92,76,0)}}
.side{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.mini{width:74px;height:40px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 0 #d9c9b4;font-size:15px;cursor:pointer}
.wave{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:6px}
.wave i{width:4px;background:var(--coral);border-radius:2px;animation:w .6s infinite alternate}
@keyframes w{from{height:4px}to{height:24px}}

/* 공통 버튼/레이어 */
.layer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(255,244,225,.96)}
.layer.dim{background:rgba(40,30,22,.55)}
.big{font-size:34px;padding:22px 46px;border-radius:28px;border:0;background:var(--orange);color:#fff;box-shadow:0 8px 0 #c96a19;cursor:pointer}
.btn{font-size:20px;padding:13px 24px;border-radius:18px;border:0;background:#fff;box-shadow:0 5px 0 #d9c9b4;cursor:pointer}
.btn.pri{background:var(--green);color:#fff;box-shadow:0 5px 0 #5f9a57}
.btn.warn{background:#fff;color:var(--coral)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.cards{display:flex;gap:16px}
.card{width:180px;background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 6px 0 #d9c9b4;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:130px;object-fit:contain}
.card b{display:block;margin-top:6px;font-family:"Jua";font-size:19px}
.hint{font-size:13px;color:var(--muted)}
.count{font-size:15px;color:var(--muted);font-family:"Noto Sans KR"}

/* 도감 */
.doc{display:flex;gap:16px}
.slot{width:180px;height:230px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #d9c9b4;cursor:pointer}
.slot.empty{background:transparent;border:4px dashed #cbb69b;box-shadow:none;font-size:52px;color:#cbb69b}
.slot img{width:140px;height:160px;object-fit:contain}
.slot b{font-family:"Jua";font-size:17px}

/* 만들기 */
.maker{display:flex;gap:28px;align-items:center}
.preview{width:230px;height:300px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #d9c9b4}
.preview img{width:190px;height:250px;object-fit:contain}
.opts{display:flex;flex-direction:column;gap:12px}
.optrow{display:flex;gap:10px;align-items:center}
.optrow .lab{width:54px;font-size:14px;color:var(--muted)}
.opt{width:76px;height:64px;border-radius:16px;border:3px solid transparent;background:#fff;box-shadow:0 4px 0 #d9c9b4;cursor:pointer;padding:4px}
.opt img{width:100%;height:100%;object-fit:contain}
.opt.sel{border-color:var(--orange)}

/* 그림판 */
.padwrap{display:flex;gap:18px;align-items:center}
#pad{background:#fff;border-radius:20px;box-shadow:0 6px 0 #d9c9b4;touch-action:none;cursor:crosshair}
.crayons{display:flex;flex-direction:column;gap:10px}
.crayon{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 #d9c9b4;cursor:pointer}
.crayon.sel{outline:3px solid var(--ink)}

/* 책 */
.book{position:absolute;inset:0;background:#FFF9EE;display:flex;flex-direction:column;z-index:15}
.booktop{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.tools{display:flex;gap:8px}
.tool{width:56px;height:56px;border-radius:16px;border:3px solid transparent;background:#fff;box-shadow:0 4px 0 #d9c9b4;cursor:pointer;padding:5px}
.tool img{width:100%;height:100%;object-fit:contain}
.tool.sel{border-color:var(--orange)}
.page{flex:1;position:relative;margin:0 16px;border-radius:22px;overflow:hidden;background:#fff}
.page img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pageactor{position:absolute;filter:drop-shadow(0 5px 0 rgba(0,0,0,.10))}
.cap{margin:10px 16px 12px;background:#fff;border-radius:18px;padding:12px 16px;font-family:"Jua";font-size:21px;display:flex;gap:12px;align-items:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:24px;box-shadow:0 4px 0 #d9c9b4;cursor:pointer;z-index:3}
.nav.l{left:8px}.nav.r{right:8px}
.fire,.cloud,.well{position:absolute;cursor:grab}
.missionbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 18px;font-family:"Jua";font-size:18px;z-index:4}

/* 리포트 */
.report{position:absolute;inset:0;background:#FBF6EE;overflow:auto;z-index:25;padding:18px 24px;font-size:14px}
.report h2{margin:0 0 4px;font-size:22px;color:var(--orange)}
.rgrid{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-top:10px}
.axes{display:flex;flex-direction:column;gap:6px}
.axline{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:7px 10px}
.axline b{width:96px;font-family:"Jua";font-weight:400}
.dots span{font-size:15px;color:#ddd;margin-right:2px}
.dots span.on{color:var(--orange)}
.q{color:var(--muted);font-size:12.5px;flex:1}
.pie{width:150px;height:150px;border-radius:50%}
.legend{font-size:12.5px;color:var(--muted);line-height:1.7}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;border-top:1px solid #e6dccd;padding-top:8px}

/* 시연 서랍 */
#hot{position:absolute;right:0;top:0;width:70px;height:70px;z-index:30}
.drawer{position:absolute;right:0;top:0;bottom:0;width:360px;background:rgba(28,22,18,.95);color:#f4ece2;z-index:40;transform:translateX(100%);transition:.3s;overflow:auto;padding:14px;font-size:13px}
.drawer.open{transform:none}
.drawer h3{margin:8px 0 6px;font-size:15px;color:var(--sun)}
.drawer button{font-size:12px;padding:6px 10px;border-radius:9px;border:0;background:#3c322a;color:#f4ece2;cursor:pointer;margin:3px 3px 0 0}
.drawer button.go{background:#5b4a3c}
#log{font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;color:#cbbfae;max-height:190px;overflow:auto;background:#241d18;border-radius:8px;padding:8px;margin-top:6px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dotted #4a3f35;padding:3px 0}
</style>
</head>
<body>
<div class="top">
  <h1>말로 짓는 인형극 — HTML 초안</h1>
  <span class="sub">구현대본 S1~S12 · 그림은 ComfyUI(krea2 turbo · 펠트 3D)로 만든 것을 그대로 씀 · 오른쪽 위 구석을 길게 누르면 시연 서랍</span>
</div>
<div class="wrap"><div class="outer" id="outer">
  <div class="phone" id="phone"><div class="screen" id="screen">

    <div class="stage" id="stage">
      <img class="bg" id="bg" src="assets/bg_start.png" alt="">
    </div>
    <div class="stars" id="stars">⭐ <span id="starN">3</span></div>

    <div class="dock" id="dock" style="display:none">
      <img class="mascot talk" id="mascotImg" src="assets/mascot.png" alt="">
      <div class="bubble" id="bubble"><span class="who">마스코트</span><span id="bubbleT">…</span></div>
      <button class="mic" id="mic">🎤</button>
      <div class="side">
        <button class="mini" id="skip">➡️</button>
        <button class="mini" id="drawBtn">🖍️</button>
      </div>
    </div>

    <div class="layer" id="layer"></div>
    <div id="hot"></div>
    <div class="drawer" id="drawer"></div>
  </div></div>
</div></div>

<script>
/* ────────────────────────────────────────────────────────────
   말로 짓는 인형극 — HTML 초안
   근거: docs/구현대본.md (S1~S12 · 칸 규격 · 턴 엔진 · 무응답 흐름)
        docs/부모리포트_설계.md (6축 · 원그래프 · 인용)
   그림: finalproject_demo/app/src/main/res/drawable (ComfyUI krea2 turbo)
   ──────────────────────────────────────────────────────────── */

const A = n => `assets/${n}.png`;
const $ = s => document.querySelector(s);
const layer = $('#layer'), bubbleT = $('#bubbleT'), bubble = $('#bubble');

/* ── 화면 비율 맞추기 ── */
function fit(){
  const o = $('#outer'), k = o.clientWidth / 1200;
  $('#phone').style.transform = `scale(${k})`;
  o.style.height = (600 * k) + 'px';
}
addEventListener('resize', fit); fit();

/* ── 상태 ── */
const S = {
  stars: 3,
  hero: {hair:'short', shirt:'blue', glasses:'round', preset:null},
  slots: {place:null, friend:null, problem:null, reason:null, sound:null, solution:null, adult:null},
  friendName: null, dino: null, title: null,
  level: '이어 짓기', s1:0, s2:0,
  redraw: 0, adultTurns: 0, gen: 0,
  answers: [],           // {mode:'말로'|'골라서'|'그려서', text}
  events: [],
  drawing: null,         // 아이가 그린 그림 dataURL
  friendsMet: []
};
const PLACE = {
  space:{name:'우주', bg:'bg_space', vehicle:'rocket', vName:'로켓', event:'로켓이 흔들려'},
  sea:  {name:'바닷속', bg:'bg_sea',  vehicle:'turtle', vName:'거북이', event:'거북이가 휘청휘청해'},
  dino: {name:'공룡 나라', bg:'bg_dino', vehicle:'train', vName:'기차', event:'기차가 덜컹거려'}
};

/* ── 이벤트 기록 (구현대본 §0-5 · 리포트 6축의 재료) ── */
function ev(type, data={}){
  S.events.push({t:Date.now(), type, ...data});
  const l = $('#log');
  if(l){ l.insertAdjacentHTML('afterbegin', `<div>${type} ${JSON.stringify(data).slice(0,70)}</div>`); }
}

/* ── 마스코트 말하기 (받아주기 → 되돌려주기 → 질문) ── */
function say(text, who='마스코트', cls=''){
  bubble.className = 'bubble ' + cls;
  bubble.innerHTML = `<span class="who">${who}</span><span id="bubbleT"></span>`;
  const el = bubble.querySelector('#bubbleT');
  let i = 0;
  clearInterval(say._t);
  say._t = setInterval(()=>{ el.textContent = text.slice(0, ++i); if(i>=text.length) clearInterval(say._t); }, 22);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* 3조각 한 턴 */
async function mascotTurn(받아주기, 되돌려주기, 질문){
  say(받아주기); await wait(1100);
  if(되돌려주기){ say(되돌려주기); await wait(1400); }
  say(질문);
}

/* ── 질문 엔진 ── */
let Q = null;   // 현재 질문 {text, cands:[{t,val,sig}], on(ans), easy, cards}
let micOn = false, noAnswer = 0;

function ask(q){
  Q = q; noAnswer = 0;
  $('#dock').style.display = 'flex';
  $('#drawBtn').style.display = q.noDraw ? 'none' : '';
  say(q.text);
}

$('#mic').onclick = () => {
  if(!Q) return;
  micOn = !micOn;
  $('#mic').classList.toggle('on', micOn);
  if(micOn){
    bubble.insertAdjacentHTML('beforeend', '<div class="wave">' +
      [...Array(9)].map((_,i)=>`<i style="animation-delay:${i*.07}s"></i>`).join('') + '</div>');
  } else {
    const c = Q.cands[Math.floor(Math.random()*Q.cands.length)];
    answer(c, '말로');
  }
};
$('#skip').onclick = () => { if(Q) noAnswerFlow(); };
$('#drawBtn').onclick = () => { if(Q) openPad(()=>answer({t:'(직접 그림)', val:'draw'}, '그려서')); };

/* 답 처리 */
async function answer(c, mode){
  micOn = false; $('#mic').classList.remove('on');
  const q = Q; Q = null;
  S.answers.push({mode, text:c.t});
  ev('utterance', {text:c.t, words:c.t.split(' ').length, mode});
  if(c.sig){ c.sig.split('+').forEach(s=>{ if(s.trim()==='S1') S.s1++; if(s.trim()==='S2') S.s2++; }); ev('signal', {sig:c.sig}); }
  if(c.emo) ev('emotion_mention', {emo:c.emo});
  say(c.t, '아이', 'child'); await wait(900);
  level();
  await q.on(c);
}

/* 무응답 흐름 (구현대본 §5) */
async function noAnswerFlow(){
  const q = Q;
  noAnswer++;
  if(noAnswer === 1 && q.easy){ say(q.easy); Q = q; return; }
  // 그림 3장
  Q = null;
  const cs = q.cards || q.cands.slice(0,3);
  say('이 중에 골라 볼까?');
  pick(cs.map(c => ({img:c.img || 'ic_bad', label:c.t, on:()=>answer(c, '골라서')})), true);
}

/* ── 수준 계산 (규칙. LLM이 아니다) ── */
function level(){
  const n = S.s1 + S.s2;
  S.level = n >= 4 ? '까닭 짓기' : n >= 2 ? '이어 짓기' : '고르며 짓기';
  paintDrawer();
}

/* ── 레이어 헬퍼 ── */
function show(html, cls='layer'){ layer.className = cls; layer.style.display='flex'; layer.innerHTML = html; }
function hide(){ layer.style.display='none'; layer.innerHTML=''; }
function pick(items, keepDock){
  if(!keepDock) $('#dock').style.display='none';
  show(`<div class="cards">${items.map((it,i)=>
    `<div class="card" data-i="${i}"><img src="${A(it.img)}"><b>${it.label}</b></div>`).join('')}</div>`);
  layer.style.background = 'rgba(255,244,225,.82)';
  layer.querySelectorAll('.card').forEach(el=>{
    el.onclick = ()=>{ hide(); layer.style.background=''; items[+el.dataset.i].on(); };
  });
}

/* ════════ S1 시작 ════════ */
function S1(){
  $('#dock').style.display='none';
  $('#bg').src = A('bg_start');
  $('#stage').querySelectorAll('.actor').forEach(e=>e.remove());
  $('#starN').textContent = S.stars;
  show(`<img src="${A('mascot')}" style="width:150px">
    <button class="big" id="go">이야기 만들기</button>
    <button class="btn" id="shelf">📚 책장</button>
    <div class="hint">어른과 함께 하는 놀이예요</div>`);
  $('#go').onclick = () => {
    if(S.stars === 0){
      show(`<img src="${A('mascot')}" style="width:130px">
        <div class="bubble" style="max-width:600px">오늘 만들 이야기는 다 썼어! 책장에 가서 지난 이야기 볼까?</div>
        <div class="row"><button class="btn" id="a">📚 책장 보기</button><button class="btn" id="b">괜찮아</button></div>`);
      $('#a').onclick = $('#b').onclick = S1;      // 반복 팝업 없음 (결정 28)
      return;
    }
    flyStar();
  };
  $('#shelf').onclick = () => { say('아직 만든 책이 없어!'); };
}
function flyStar(){
  const s = document.createElement('div');
  s.className = 'starfly'; s.textContent = '⭐';
  const r = $('#stars').getBoundingClientRect();
  s.style.left = r.left + 'px'; s.style.top = r.top + 'px';
  document.body.appendChild(s);
  requestAnimationFrame(()=>{
    s.style.left = (innerWidth/2) + 'px'; s.style.top = (innerHeight/2) + 'px';
    s.style.transform = 'scale(2.6)'; s.style.opacity = '0';
  });
  setTimeout(()=>{ s.remove(); S.stars--; $('#starN').textContent = S.stars; ev('story_start'); S2(); }, 950);
}

/* ════════ S2 도감 (주인공 4칸) ════════ */
function S2(){
  $('#dock').style.display='flex';
  say('안경 쓴 지호, 파란 옷 지호가 있어. 오늘은 누구랑 갈까?');
  show(`<div class="doc">
    <div class="slot" data-h="hero_glasses"><img src="${A('hero_glasses')}"><b>안경 쓴 지호</b></div>
    <div class="slot" data-h="hero_blue"><img src="${A('hero_blue')}"><b>파란 옷 지호</b></div>
    <div class="slot empty" data-h="new">＋</div>
    <div class="slot empty" data-h="new">＋</div>
  </div>`);
  layer.style.background='rgba(255,244,225,.9)';
  layer.querySelectorAll('.slot').forEach(el=>{
    el.onclick = () => {
      hide(); layer.style.background='';
      if(el.dataset.h === 'new') return S2b();
      S.hero.preset = el.dataset.h; S3_1();
    };
  });
}

/* ════════ S2b 주인공 만들기 ════════ */
function heroSrc(){
  return S.hero.preset ? A(S.hero.preset)
    : A(`hero_${S.hero.hair}_${S.hero.shirt}_${S.hero.glasses}`);
}
function S2b(){
  say('우리 주인공을 만들자! 말로 만들까, 골라서 만들까?');
  show(`<div class="row">
    <button class="btn pri" id="voice">🎤 말로 만들기</button>
    <button class="btn" id="choose">👆 골라서 만들기</button></div>`);
  $('#choose').onclick = () => { hide(); makerUI(); };
  $('#voice').onclick  = () => { hide(); makerVoice(); };
}
function makerUI(){
  S.hero.preset = null;
  const opts = {
    hair:[['short','ic_hair_short'],['long','ic_hair_long'],['tied','ic_hair_tied']],
    shirt:[['red','ic_shirt_red'],['blue','ic_shirt_blue'],['yellow','ic_shirt_yellow']],
    glasses:[['none','ic_glasses_none'],['round','ic_glasses_round'],['square','ic_glasses_square']]
  };
  const lab = {hair:'머리', shirt:'옷', glasses:'안경'};
  show(`<div class="maker">
    <div class="preview"><img id="pv" src="${heroSrc()}"></div>
    <div class="opts">${Object.entries(opts).map(([k,v])=>
      `<div class="optrow"><span class="lab">${lab[k]}</span>${v.map(([val,ic])=>
        `<button class="opt ${S.hero[k]===val?'sel':''}" data-k="${k}" data-v="${val}"><img src="${A(ic)}"></button>`).join('')}</div>`).join('')}
      <button class="btn pri" id="done" style="margin-top:8px">이걸로 할래 🙂</button>
    </div></div>
    <div class="hint">생성하지 않습니다. 미리 만든 27장에서 골라 끼웁니다 (결정 20)</div>`);
  layer.querySelectorAll('.opt').forEach(b=>{
    b.onclick = () => {
      S.hero[b.dataset.k] = b.dataset.v;
      layer.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      $('#pv').src = heroSrc();
      ev('make', {what:'hero_option'});
    };
  });
  $('#done').onclick = () => { hide(); ev('make', {what:'hero_done'}); S3_1(); };
}
function makerVoice(){
  S.hero.preset = null;
  const qs = [
    {text:'머리는 짧아, 길어, 묶었어?', key:'hair',
     cands:[{t:'짧아!',val:'short'},{t:'길어!',val:'long'},{t:'묶었어!',val:'tied'},{t:'짧게 짧게!',val:'short'},{t:'긴 머리가 좋아!',val:'long'}]},
    {text:'빨강, 파랑, 노랑 옷이 있어. 무슨 색 입을까?', key:'shirt',
     cands:[{t:'파랑!',val:'blue'},{t:'빨간 거!',val:'red'},{t:'노랑!',val:'yellow'},{t:'파란색 좋아!',val:'blue'},{t:'빨강 빨강!',val:'red'}]},
    {text:'안경은 어때? 동글 안경, 네모 안경, 안 쓸래?', key:'glasses',
     cands:[{t:'동글 안경!',val:'round'},{t:'네모 안경!',val:'square'},{t:'안 써!',val:'none'},{t:'동그란 거!',val:'round'},{t:'안경 싫어!',val:'none'}]}
  ];
  let i = 0;
  const step = () => {
    if(i >= qs.length) return confirmHero();
    const q = qs[i++];
    ask({text:q.text, noDraw:true, cands:q.cands, on: async c => {
      S.hero[q.key] = c.val;
      show(`<div class="preview"><img src="${heroSrc()}"></div>`);
      layer.style.background='rgba(255,244,225,.6)';
      await wait(900); hide(); layer.style.background='';
      step();
    }});
  };
  step();
}
function confirmHero(){
  say('짠! 이렇게 생겼어. 좋아, 싫어?');
  show(`<div class="preview"><img src="${heroSrc()}"></div>
    <div class="row"><button class="btn pri" id="ok">좋아 🙂</button><button class="btn warn" id="no">싫어 ✏️</button></div>
    <div class="count">다시 만들기 ${S.redraw}/2</div>`);
  layer.style.background='rgba(255,244,225,.88)';
  $('#ok').onclick = () => { hide(); layer.style.background=''; ev('make',{what:'hero_done'}); S3_1(); };
  $('#no').onclick = () => {
    hide(); layer.style.background='';
    if(S.redraw >= 2){ say('그럼 만든 것 중에 골라 볼까?'); return setTimeout(makerUI, 900); }
    S.redraw++; ev('redraw', {n:S.redraw, where:'hero'});
    ask({text:'어떤 게 마음에 안 들어?', noDraw:true, cands:[
      {t:'머리 다르게!',k:'hair'},{t:'옷 색 바꿔!',k:'shirt'},{t:'안경 바꿔!',k:'glasses'},
      {t:'빨간 옷이 좋아!',k:'shirt',v:'red'},{t:'안경 안 쓸래!',k:'glasses',v:'none'}
    ], on: async c => {
      const pools = {hair:['short','long','tied'], shirt:['red','blue','yellow'], glasses:['none','round','square']};
      S.hero[c.k] = c.v || pools[c.k][Math.floor(Math.random()*3)];
      await wait(500); confirmHero();
    }});
  };
}

/* ════════ S5 그림판 ════════ */
function openPad(after){
  $('#dock').style.display='flex';
  show(`<div class="padwrap">
    <div class="crayons">
      ${['#F25C4C','#63B3ED','#F9B233','#86C77D'].map((c,i)=>
        `<div class="crayon ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}
      <div class="crayon" data-c="erase" style="background:#fff;font-size:22px;text-align:center;line-height:52px">🧽</div>
    </div>
    <canvas id="pad" width="620" height="380"></canvas>
    <div class="opts">
      <button class="btn pri" id="pdone">다 그렸어</button>
      <button class="btn" id="pskip">그리기 싫어</button>
    </div></div>`);
  layer.style.background='rgba(255,244,225,.96)';
  const cv = $('#pad'), cx = cv.getContext('2d');
  cx.lineCap = cx.lineJoin = 'round';
  let color = '#F25C4C', down = false;
  layer.querySelectorAll('.crayon').forEach(c=>{
    c.onclick = () => {
      layer.querySelectorAll('.crayon').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel'); color = c.dataset.c;
    };
  });
  const pos = e => { const r = cv.getBoundingClientRect(); const k = 620/r.width;
    return [(e.clientX-r.left)*k, (e.clientY-r.top)*k]; };
  cv.onpointerdown = e => { down = true; cx.beginPath(); cx.moveTo(...pos(e)); };
  cv.onpointermove = e => {
    if(!down) return;
    cx.strokeStyle = color === 'erase' ? '#fff' : color;
    cx.lineWidth = color === 'erase' ? 34 : 13;
    cx.lineTo(...pos(e)); cx.stroke();
  };
  addEventListener('pointerup', ()=> down = false);
  $('#pdone').onclick = () => {
    S.drawing = cv.toDataURL(); ev('make', {what:'draw'});
    hide(); layer.style.background=''; after();
  };
  $('#pskip').onclick = () => { hide(); layer.style.background=''; after(); };
}

/* ════════ S6 소리 ════════ */
function S6(){
  const pool = {dino_trex:['크아아앙!','어흥!','쿠오오오!','크르릉!','으르렁 쿵!'],
                dino_long:['우우웅~','뿌우우~','우와아~','음머어~','우우 우우~'],
                dino_horn:['뿌우우우웅!','뿌뿌뿌!','끼야아!','뿌웅 뿌웅!','부우우!']}[S.dino.id];
  ask({
    text:`${S.dino.nm}은 어떻게 울어?`, noDraw:true,
    cands:pool.map(t=>({t})),
    on: async c => {
      S.slots.sound = c.t;
      ev('make', {what:'sound'});         // 말한 횟수에 세지 않는다 → utterance 에서 제거
      S.events = S.events.filter(e => !(e.type==='utterance' && e.text===c.t));
      S.answers.pop();
      await mascotTurn('우와, 진짜 공룡 같다!', '이 소리는 폰에만 있고 밖으로 안 나가.', '그림도 만들어 볼게!');
      await wait(1400); S7();
    }
  });
}

  S.gen++;

  show(`<div class="preview" style="width:320px;height:300px"><img src="${A(S.dino.id)}" id="confirmImg"></div>

  $('#ok').onclick = () => { hide(); layer.style.background=''; S3_solve(); };
  $('#dw').onclick = () => { hide(); layer.style.background=''; openPad(()=>S3_solve()); };
  $('#no').onclick = () => {

      text:'어떤 게 마음에 안 들어?', noDraw:true,

      ],
      on: async c => {

}

      say(txt, '이모', 'adult'); await wait(1300);
    }
    await mascotTurn('좋다!', null, '책을 만들고 있어! 이 책 이름은 뭐라고 할까?');
    await wait(1000); S8();
  };
  layer.querySelectorAll('.btn').forEach(b => b.onclick = () => go(b.dataset.a));
}

/* ════════ S8 책 만드는 중 ════════ */
function S8(){
  const nm = S.friendName || '친구', pl = PLACE[S.slots.place].name;
  ask({
    text:'이 책 이름은 뭐라고 할까?', noDraw:true,
    cands:[{t:`지호랑 ${nm}랑 ${pl} 놀이!`},{t:`${nm}와 로켓 모험!`},
           {t:`${pl}에서 만난 ${nm}!`},{t:'지호의 우주 여행!'},{t:`${nm}야, 같이 놀자!`}],
    on: async c => {
      S.title = c.t.replace('!','');
      say('책을 만들고 있어…'); $('#dock').style.display='flex';
      show(`<div style="font-size:60px">📖</div><div class="hint">이미 있는 그림은 다시 그리지 않습니다. 새로 만드는 건 미션 물체와 쪽별 소품뿐</div>`);
      layer.style.background='rgba(255,244,225,.9)';
      await wait(1800); hide(); layer.style.background='';
      S9();
    }
  });
}

/* ════════ S9 책 ════════ */
const PAGES = () => {
  const p = PLACE[S.slots.place], nm = S.friendName || '친구';
  return [
    {cap:`『${S.title}』`, cover:true},
    {cap:`{주인공}은 ${p.vName}을 타고 반짝이는 ${p.name}로 떠났어요.`, bg:p.bg, cast:['hero','vehicle']},
    {cap:`그런데 갑자기 ${S.slots.problem}. 쿵!`, bg:p.bg, cast:['hero','vehicle'], shake:true},
    {cap:`창문 밖에서 ${nm}가 쳐다보고 있었어요.`, bg:p.bg, cast:['hero','friend']},
    {cap:`${nm}가 너무 세게 흔드는 바람에 ${p.vName}에 불이 붙었어요!`, bg:p.bg, cast:['vehicle'], mission:1},
    {cap:`${nm}는 "${S.slots.reason}. 미안해" 하고 말했어요. 그런데 ${nm} 별의 우물이 말랐대요.`, bg:p.bg, cast:['friend'], mission:2},
    {cap:`${S.slots.solution} 셋은 다음에도 같이 놀기로 했어요.`, bg:p.bg, cast:['hero','friend','dino']}
  ];
};
let pg = 0, tool = 'ic_hand';
function S9(){
  pg = 0; renderBook();
}
function renderBook(){
  const pages = PAGES(), P = pages[pg];
  const p = PLACE[S.slots.place];
  const heroImg = S.hero.preset || `hero_${S.hero.hair}_${S.hero.shirt}_${S.hero.glasses}`;
  const castHTML = (P.cast||[]).map(c=>{
    if(c==='hero')   return `<img class="pageactor" data-c="hero" src="${A(heroImg)}" style="left:7%;bottom:6%;height:46%">`;
    if(c==='vehicle')return `<img class="pageactor" data-c="vehicle" src="${A(p.vehicle)}" style="left:34%;bottom:10%;height:36%">`;
    if(c==='friend') return S.drawing
        ? `<img class="pageactor" data-c="friend" src="${S.drawing}" style="right:8%;bottom:8%;height:44%;object-fit:contain">`
        : `<img class="pageactor" data-c="friend" src="${A(S.slots.friend)}" style="right:8%;bottom:8%;height:40%">`;
    if(c==='dino')   return `<img class="pageactor" data-c="dino" src="${A(S.dino.id)}" style="left:58%;bottom:7%;height:34%">`;
    return '';
  }).join('');

  const html = `<div class="book" id="book">
    <div class="booktop">
      <div class="tools">${['ic_hand','ic_hammer','ic_feather','ic_magnifier'].map(t=>
        `<button class="tool ${tool===t?'sel':''}" data-t="${t}"><img src="${A(t)}"></button>`).join('')}</div>
      <div class="jua" style="font-size:18px">${pg} / ${PAGES().length-1} 쪽</div>
    </div>
    <div class="page" id="page">
      ${P.cover
        ? `<img class="bg" src="${A(p.bg)}"><img class="pageactor" src="${A(heroImg)}" style="left:14%;bottom:8%;height:56%">
           ${S.drawing?`<img class="pageactor" src="${S.drawing}" style="right:12%;bottom:8%;height:50%;object-fit:contain">`:''}
           <div class="missionbar">『${S.title}』</div>`
        : `<img class="bg" src="${A(P.bg)}">${castHTML}`}
      ${P.mission ? `<div class="missionbar" id="mbar"></div>` : ''}
    </div>
    <div class="cap"><img src="${A('ic_speaker')}" style="width:30px;cursor:pointer" id="spk"><span>${P.cap.replace('{주인공}','지호')}</span></div>
    <button class="nav l" id="prev">◀</button><button class="nav r" id="next">▶</button>
  </div>`;
  const old = $('#book'); if(old) old.remove();
  $('#screen').insertAdjacentHTML('beforeend', html);
  $('#dock').style.display='none';

  $('#prev').onclick = ()=>{ if(pg>0){ pg--; renderBook(); } };
  $('#next').onclick = ()=>{ if(pg < PAGES().length-1){ pg++; renderBook(); } else S10(); };
  $('#book').querySelectorAll('.tool').forEach(b=> b.onclick = ()=>{ tool = b.dataset.t; renderBook(); });
  $('#spk').onclick = ()=> say(P.cap.replace('{주인공}','지호'));

  // 자유 도구 반응
  $('#page').querySelectorAll('.pageactor').forEach(el=>{
    el.onclick = () => {
      const r = {ic_hand:'히히!', ic_hammer:'간지러워!', ic_feather:'깔깔깔!'}[tool];
      if(tool === 'ic_magnifier'){
        const t = {hero:'지호야', vehicle:PLACE[S.slots.place].vName, friend:S.friendName, dino:S.dino.nm}[el.dataset.c];
        pop(el, `🔍 ${t}`);
      } else if(el.dataset.c === 'dino'){ pop(el, `부르르! ${S.slots.sound||'크아앙!'}`); }
      else pop(el, r);
      el.animate([{transform:'translateY(0)'},{transform:'translateY(-18px)'},{transform:'translateY(0)'}], {duration:400});
    };
  });

  if(P.shake) $('#page').classList.add('shake');
  if(P.mission === 1) mission1();
  if(P.mission === 2) mission2();
}
function pop(el, text){
  const d = document.createElement('div');
  d.className = 'missionbar'; d.textContent = text;
  d.style.cssText += 'top:auto;bottom:12%;left:50%;';
  $('#page').appendChild(d); setTimeout(()=>d.remove(), 1400);
}

/* 미션 1 — 문지르기 (쉬움) */
function mission1(){
  $('#mbar').textContent = `큰일이야, ${PLACE[S.slots.place].vName}에 불이 났어! 손가락으로 슥슥 물을 뿌려 줘!`;
  ev('mission', {n:1, kind:'문지르기', state:'start'});
  const page = $('#page');
  const fires = [[30,55],[46,62],[60,50]].map(([x,y])=>{
    const f = document.createElement('img');
    f.src = A('prop_fire'); f.className='fire';
    f.style.cssText = `left:${x}%;top:${y}%;height:18%;position:absolute`;
    f.dataset.hp = '3'; page.appendChild(f); return f;
  });
  const hose = document.createElement('img');
  hose.src = A('prop_hose'); hose.style.cssText='position:absolute;right:4%;bottom:6%;height:22%';
  page.appendChild(hose);
  let done = 0;
  page.onpointermove = e => {
    fires.forEach(f=>{
      if(f.dataset.hp === '0') return;
      const r = f.getBoundingClientRect();
      if(e.clientX>r.left && e.clientX<r.right && e.clientY>r.top && e.clientY<r.bottom){
        const hp = +f.dataset.hp - 1; f.dataset.hp = hp;
        f.style.height = (18 * (hp/3) + 4) + '%';
        if(hp === 0){
          f.src = A('prop_smoke'); done++;
          setTimeout(()=>{ f.style.opacity = '0'; }, 500);
          if(done === 3){
            $('#mbar').textContent = '불을 다 껐어! 대단해!';
            ev('mission', {n:1, kind:'문지르기', state:'success', helped:false});
            const sp = document.createElement('img');
            sp.src = A('prop_splash'); sp.style.cssText='position:absolute;left:40%;top:40%;height:30%';
            page.appendChild(sp);
          }
        }
      }
    });
  };
}
/* 미션 2 — 끌어다 놓기 (보통) */
function mission2(){
  const nm = S.friendName || '친구';
  $('#mbar').textContent = `${nm} 별 우물이 말랐어. 비구름을 끌어서 우물 위에 놓아 줄래?`;
  ev('mission', {n:2, kind:'끌어다 놓기', state:'start'});
  const page = $('#page');
  const well = document.createElement('img');
  well.src = A('prop_well'); well.className='well';
  well.style.cssText='position:absolute;left:42%;bottom:8%;height:30%';
  page.appendChild(well);
  const cloud = document.createElement('img');
  cloud.src = A('prop_cloud'); cloud.className='cloud';
  cloud.style.cssText='position:absolute;left:8%;top:8%;height:22%;cursor:grab';
  page.appendChild(cloud);
  let lv = 0, drag = false;
  cloud.onpointerdown = e => { drag = true; cloud.setPointerCapture(e.pointerId); };
  cloud.onpointermove = e => {
    if(!drag) return;
    const r = page.getBoundingClientRect();
    cloud.style.left = ((e.clientX - r.left)/r.width*100 - 8) + '%';
    cloud.style.top  = ((e.clientY - r.top )/r.height*100 - 10) + '%';
  };
  cloud.onpointerup = () => {
    drag = false;
    const a = cloud.getBoundingClientRect(), b = well.getBoundingClientRect();
    const hit = a.left < b.right + 80 && a.right > b.left - 80 && a.bottom > b.top - 120;
    if(hit){
      lv = Math.min(3, lv + 1);
      $('#mbar').textContent = ['','우물에 물이 조금 찼어!','반이나 찼어!','우물이 가득 찼어! 고마워!'][lv];
      const rain = document.createElement('img');
      rain.src = A('prop_splash'); rain.style.cssText='position:absolute;left:44%;bottom:28%;height:16%';
      page.appendChild(rain); setTimeout(()=>rain.remove(), 700);
      if(lv === 3) ev('mission', {n:2, kind:'끌어다 놓기', state:'success', helped:false});
    } else {
      $('#mbar').textContent = '우물 위에 놓아 줘!';
    }
  };
}

/* ════════ S10 친구 평가 ════════ */
function S10(){
  const b = $('#book'); if(b) b.remove();
  $('#dock').style.display='flex';
  say('오늘 만난 친구들이야. 또 만나고 싶은 친구는 누구야?');
  const list = S.friendsMet.concat(S.dino ? [{id:S.dino.id, nm:S.dino.nm}] : []);
  show(`<div class="cards">${list.map((f,i)=>
    `<div class="card" style="cursor:default">
      <img src="${f.id===S.slots.friend && S.drawing ? S.drawing : A(f.id)}"><b>${f.nm}</b>
      <div class="row" style="margin-top:6px">
        <button class="btn" data-i="${i}" data-v="1" style="font-size:15px;padding:7px 10px">또 만날래 💛</button>
        <button class="btn" data-i="${i}" data-v="0" style="font-size:15px;padding:7px 10px">안녕 👋</button>
      </div></div>`).join('')}</div>`);
  layer.style.background='rgba(255,244,225,.9)';
  let n = 0;
  layer.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = () => {
      const card = btn.closest('.card');
      card.style.opacity = '.45';
      card.querySelectorAll('button').forEach(x=>x.disabled = true);
      ev('friend_rating', {nm:list[+btn.dataset.i].nm, keep:btn.dataset.v==='1'});
      if(++n >= list.length){ setTimeout(()=>{ hide(); layer.style.background=''; S11(); }, 700); }
    };
  });
}

/* ════════ S11 끝내기 ════════ */
async function S11(){
  say('책 다 만들었다! 엄마한테 보여주러 가자!');
  show(`<div class="row">
      <div class="card" style="cursor:default"><img src="${A('gift_book')}"><b>해결 방법 도감 첫 칸</b></div>
      <div class="card" style="cursor:default"><img src="${A('gift_crayon')}"><b>무지개 크레용</b></div>
    </div>
    <button class="btn pri" id="fin">📚 책장에 꽂기</button>`);
  layer.style.background='rgba(255,244,225,.92)';
  $('#fin').onclick = async () => {
    ev('session_end', {min:14, done:true});
    show(`<div class="jua" style="font-size:34px;color:#fff">오늘은 여기까지!</div>
      <button class="btn" id="parent">부모 모드 보기</button>`);
    layer.className = 'layer dim';
    $('#dock').style.display='none';
    $('#parent').onclick = S12;
  };
}

/* ════════ S12 부모 모드 — 6축 리포트 ════════ */
function S12(){
  const E = S.events;
  const utt = E.filter(e=>e.type==='utterance');
  const ax = {
    '말하기':      {n:utt.length, q:(utt.slice().sort((a,b)=>b.text.length-a.text.length)[0]||{}).text},
    '이유 말하기': {n:E.filter(e=>e.type==='signal'&&e.sig.includes('S1')).length, q:S.slots.reason},
    '마음 말하기': {n:E.filter(e=>e.type==='emotion_mention').length, q:(E.find(e=>e.type==='emotion_mention')||{}).emo},
    '이야기 채우기':{n:E.filter(e=>e.type==='signal'&&e.sig.includes('S2')).length, q:S.slots.solution},
    '만들기':      {n:E.filter(e=>e.type==='make').length, q:null},
    '함께하기':    {n:S.adultTurns, q:S.slots.adult}
  };
  const step = n => n === 0 ? 0 : n <= 2 ? 1 : 2;    // 3단계 (없음 · 있었음 · 여러 번)
  const modes = {'말로':0,'골라서':0,'그려서':0};
  S.answers.forEach(a=>modes[a.mode]++);
  const tot = Math.max(1, S.answers.length);
  const deg = k => Math.round(modes[k]/tot*360);
  const c1 = deg('말로'), c2 = c1 + deg('골라서');

  const b = $('#book'); if(b) b.remove();
  hide();
  $('#screen').insertAdjacentHTML('beforeend', `<div class="report" id="rep">
    <h2>오늘의 기록</h2>
    <div class="hint">『${S.title||'제목 없음'}』 · 약 14분 · ${utt.length}번 중 ${utt.length}번을 셌어요 (또렷하게 들린 말만 셉니다)</div>
    <div class="rgrid">
      <div>
        <h3 style="font-size:15px;margin:10px 0 6px">오늘 이야기 모양</h3>
        <div class="axes">${Object.entries(ax).map(([k,v])=>`
          <div class="axline">
            <b>${k}</b>
            <span class="dots">${[0,1,2].map(i=>`<span class="${i<step(v.n)?'on':''}">●</span>`).join('')}</span>
            <span class="count" style="width:28px">${v.n}</span>
            <span class="q">${v.n===0?'오늘은 안 나왔어요':(v.q?'"'+v.q+'"':'')}</span>
          </div>`).join('')}</div>
        <div class="hint" style="margin-top:8px">이야기마다 모양이 달라요. 점수도 또래 비교도 없습니다.</div>
      </div>
      <div>
        <h3 style="font-size:15px;margin:10px 0 6px">오늘 말한 방식</h3>
        <div class="row" style="justify-content:flex-start;gap:18px">
          <div class="pie" style="background:conic-gradient(var(--orange) 0 ${c1}deg, var(--blue) ${c1}deg ${c2}deg, var(--green) ${c2}deg 360deg)"></div>
          <div class="legend">
            <div>● 말로 답함 — ${modes['말로']}</div>
            <div>● 골라서 답함 — ${modes['골라서']}</div>
            <div>● 그려서 답함 — ${modes['그려서']}</div>
            <div style="margin-top:8px">고르기도 이야기를 짓는 방법이에요.</div>
          </div>
        </div>
        <h3 style="font-size:15px;margin:16px 0 6px">다음에 이렇게 물어보세요</h3>
        <div class="legend">· "${S.friendName||'친구'}는 어떻게 집에 돌아갔을까?"<br>· "그때 지호 마음은 어땠어?"<br>· "다음엔 어디로 가고 싶어?"</div>
        <div class="note">
          놀이 대화 요약이며 언어발달 평가·진단이 아닙니다. 본 제품은 의료기기가 아니므로 질병 유무를 판단할 수 없으며,
          질병 유무 판단을 위해서는 의사의 검진이 필요합니다. 궁금한 점은 영유아건강검진(K-DST)이나 언어재활사와 상담하세요.
        </div>
        <div class="row" style="justify-content:flex-start;margin-top:10px">
          <button class="btn" id="again" style="font-size:16px">처음부터 다시</button>
        </div>
      </div>
    </div>
  </div>`);
  $('#again').onclick = () => location.reload();
}

/* ════════ 시연 서랍 ════════ */
let holdT;
$('#hot').onpointerdown = () => { holdT = setTimeout(()=>$('#drawer').classList.add('open'), 900); };
$('#hot').onpointerup = () => clearTimeout(holdT);
function paintDrawer(){
  const d = $('#drawer');
  if(!d.classList.contains('open') && d.dataset.built) { buildDrawer(); return; }
  buildDrawer();
}
function buildDrawer(){
  const d = $('#drawer'); d.dataset.built = '1';
  const scenes = [['S1 시작',S1],['S2 도감',S2],['S2b 만들기',S2b],['S3 1턴',S3_1],
                  ['S6 소리',()=>{S.dino=S.dino||{id:'dino_trex',nm:'티라노'};S6();}],
                  ['S7 확인',()=>{S.dino=S.dino||{id:'dino_trex',nm:'티라노'};S7();}],
                  ['S9 책',()=>{fillDemo();S9();}],['S10 평가',()=>{fillDemo();S10();}],
                  ['S12 리포트',()=>{fillDemo();S12();}]];
  window._sc = scenes;
  d.innerHTML = `
    <button style="float:right" onclick="document.getElementById('drawer').classList.remove('open')">닫기 ✕</button>
    <h3>🎮 장면 이동</h3>
    ${scenes.map((s,i)=>`<button class="go" onclick="_sc[${i}][1]()">${s[0]}</button>`).join('')}
    <h3>📊 상태</h3>
    <div class="kv"><span>수준</span><b>${S.level}</b></div>
    <div class="kv"><span>신호 S1 / S2</span><b>${S.s1} / ${S.s2}</b></div>
    <div class="kv"><span>별</span><b>${S.stars}</b></div>
    <div class="kv"><span>말한 횟수</span><b>${S.events.filter(e=>e.type==='utterance').length}</b></div>
    <div class="kv"><span>어른 발화</span><b>${S.adultTurns}</b></div>
    <div class="kv"><span>생성 이미지</span><b>${S.gen}</b></div>
    <div class="kv"><span>칸</span><b>${Object.values(S.slots).filter(Boolean).length} / 7</b></div>
    <h3>⚙️ 뒤에서</h3>
    <div class="legend" style="font-size:11.5px;line-height:1.6">
      · 모든 질문은 열린 질문. 카드는 무응답·모호한 말 확인일 때만 (결정 30)<br>
      · 수준은 규칙이 계산합니다. LLM은 신호 S1·S2만 판정<br>
      · 색·크기·표정 변경은 생성 없이 0초 (결정 26)<br>
      · 소리 녹음과 아이 그림은 폰 밖으로 안 나감
    </div>
    <h3>🚫 이 초안에 없는 것</h3>
    <div class="legend" style="font-size:11.5px;line-height:1.6">
      음성 인식 · 실제 LLM 호출 · ComfyUI 실시간 생성 · 저장 · 결제
    </div>
    <h3>📝 로그</h3><div id="log"></div>`;
}
function fillDemo(){
  S.slots.place ||= 'space'; S.slots.problem ||= '외계인';
  S.slots.friend ||= 'nc_alien'; S.slots.reason ||= '친구가 없어서 심심했어';
  S.slots.solution ||= '별을 땄어요'; S.friendName ||= '뿌뿌';
  S.dino ||= {id:'dino_trex', nm:'티라노'}; S.title ||= '지호랑 뿌뿌랑 우주 놀이';
  S.slots.sound ||= '크아아앙!';
  if(!S.friendsMet.length) S.friendsMet = [{id:'nc_alien', nm:'뿌뿌'}];
  if(!S.answers.length) S.answers = [{mode:'말로'},{mode:'말로'},{mode:'골라서'}];
}
buildDrawer();

/* 시작 */
S1();
</script>
</body>
</html>
