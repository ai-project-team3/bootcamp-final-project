# 전역 항목 카탈로그. 항목 id는 템플릿을 넘어 고정된다.
# 조장(역할 5)이 작성한다. W1 1일차에 30개 + 12개 이하가 여기 채워진다.
#
# 검증 규칙 (로드 시 강제, guidelines/2 참조)
#   aliases 최소 3개 (권장 5개)
#   1층 slots 1~4개 / 2층 slots 없음
#
# 아래는 형식 예시 하나. 실제 항목으로 교체한다.

items:
  - id: budget_approval
    label: 예산 승인
    aliases:
      - 가격이 좀
      - 예산이 빠듯해서
      - 생각보다 비싸네요
      - 부담스럽네요
      - 여력이 안 되는데
    keywords: [예산, 가격, 비용]
    slots:
      - key: amount
        label: 금액
        cues:
          - 그 정도면 괜찮네요
          - 그 금액이면 가능합니다
          - 납득이 되네요
        blockers:
          - 근데 위에서 좀
          - 다시 생각해보니 부담이
          - 아무래도 무리인 것 같네요
