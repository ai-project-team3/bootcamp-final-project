# The monitor on port 80. /stats is proxied to the backend container so the page can poll it
# from the same origin — no CORS, and the backend never has to be published on port 80 itself.
#
# Admin only since 10-07 (backend/app/admin.py): the page is on the public domain. Every request but the
# sign-in page and the sign-in calls asks the backend's /admin/check first; no session → /login.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /login.html { }

    location /admin/ {
        proxy_pass http://otto-backend:8010/admin/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /_auth {
        internal;
        proxy_pass http://otto-backend:8010/admin/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location @signin { return 302 /login.html; }

    location /stats {
        # the backend checks the session itself too (401 without it) — the page then sends you to sign in
        proxy_pass http://otto-backend:8010/stats;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @signin;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
