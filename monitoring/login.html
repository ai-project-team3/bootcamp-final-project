<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>오또 관리자 로그인</title>
<style>
  :root {
    --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #857b6e;
    --line: #e7e0d6; --bar: #e8b84b; --bad: #c0503f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b17; --card: #2a2520; --ink: #f0e9df; --muted: #a39687;
      --line: #3b342d; --bar: #d9a83f; --bad: #e07a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  form {
    width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: -6px 0 6px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  input {
    font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--bar); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; padding: 10px; border-radius: 999px; border: 0;
    background: var(--bar); color: #2b2620; cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-size: 13px; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>오또 관리자</h1>
  <p class="sub">엔드포인트 모니터는 관리자만 볼 수 있어요</p>
  <label>아이디<input name="user" autocomplete="username" required autofocus></label>
  <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="err" role="alert"></p>
  <button id="go" type="submit">로그인</button>
</form>
<script>
const MESSAGES = {
  401: "아이디나 비밀번호가 맞지 않아요",
  429: "여러 번 틀렸어요. 몇 분 뒤에 다시 해 주세요",
  503: "이 서버에는 아직 관리자 계정이 설정되지 않았어요",
};
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  err.textContent = ""; go.disabled = true;
  try {
    const r = await fetch("/admin/login", {
      method: "POST", body: new URLSearchParams(new FormData(e.target)), credentials: "same-origin",
    });
    if (r.status === 204) { location.replace("/"); return; }
    err.textContent = MESSAGES[r.status] || ("로그인하지 못했어요 (HTTP " + r.status + ")");
  } catch (_) {
    err.textContent = "서버에 연결할 수 없어요";
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
