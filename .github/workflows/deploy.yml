# PC1 = the shared PC behind the lead's desk — not the lead's own PC (docs/서버_세팅.md)
name: Deploy backend (PC1)

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: [self-hosted, pc1]
    steps:
      - uses: actions/checkout@v4

      # The keys live OUTSIDE the checkout: checkout runs `git clean -ffdx`, which deletes
      # ignored files — a .env copied into the work folder would be gone on the next deploy.
      - name: Bring .env from C:\otto\.env
        run: |
          if (-not (Test-Path "C:\otto\.env")) {
            Write-Error "C:\otto\.env not found - copy it there by USB once (see docs/서버_세팅.md)"
            exit 1
          }
          Copy-Item "C:\otto\.env" ".env" -Force

      - name: Install backend dependencies
        working-directory: backend
        run: py -m pip install -r requirements.txt

      - name: Stop existing backend
        run: .\scripts\deploy\stop_backend.ps1

      - name: Start backend
        # The runner kills every process a job started when the job ends (orphan cleanup),
        # found through RUNNER_TRACKING_ID. Blank it so the backend outlives the job.
        env:
          RUNNER_TRACKING_ID: ""
        run: .\scripts\deploy\start_backend.ps1

      - name: Health check
        run: |
          $ok = $false
          $result = $null
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $result = Invoke-RestMethod -Uri http://127.0.0.1:8010/health -TimeoutSec 3
              if ($result.status -eq "ok" -and $result.mock -eq $false) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Error "backend did not come up healthy within 30s"
            exit 1
          }
          Write-Host "backend healthy: mock=$($result.mock)"
