name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

# A newer push to the same branch makes the older run moot — stop it instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle distribution, dependencies and build cache between runs (#60).
      # Only main writes the cache; PR runs read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
      - name: Unit tests and debug build
        working-directory: android
        # One Gradle invocation: the second one paid configuration again.
        # -ProborazziVerify=false: reference screenshots were captured on the lead's
        # Windows PC — Linux's font/antialiasing renders differently, so pixel-diff
        # verification always fails here regardless of code changes.
        run: ./gradlew -q --build-cache :app:testDebugUnitTest :app:assembleDebug -ProborazziVerify=false
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
