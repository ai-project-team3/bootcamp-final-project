name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base — a PR stacked on another branch used to get no tests at all
  # until the one below it merged (10-05: #117 and #123 had to be closed and reopened).
  pull_request:

# A newer push to the same branch makes the older run moot — stop it instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q tests

  # Did this change touch anything the Android suite depends on? A docs-only PR (guidelines/,
  # docs/, *.md) skips the ~7 min suite (10-02). Anything outside those paths runs it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # a new branch or a force-push has no usable base: run everything
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only "$base" HEAD)
          echo "$changed"
          code=$(echo "$changed" | grep -vE '^(docs/|guidelines/)|\.md$' || true)
          if [ -n "$code" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  # The Android suite split three ways, each on its own runner (10-02: one runner took ~7 min,
  # almost all of it the tests themselves — the Gradle cache had little left to save).
  android-shard:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle distribution, dependencies and build cache between runs (#60).
      # Only main writes the cache; PR runs read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
      - name: Pick this shard's test classes
        id: pick
        working-directory: android
        # Every test class, sorted, dealt out in turn — a new test file lands in a shard by itself.
        run: |
          args=$(find app/src/test/java -name '*.kt' -print0 | xargs -0 grep -l '@Test' \
            | sed -e 's|^app/src/test/java/||' -e 's|\.kt$||' -e 's|/|.|g' | sort \
            | awk -v n=3 -v k=${{ matrix.shard }} 'NR % n == k { printf "--tests %s ", $0 }')
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Unit tests (shard ${{ matrix.shard }}) and, on shard 0, the debug build
        working-directory: android
        # -ProborazziVerify=false: reference screenshots were captured on the lead's
        # Windows PC — Linux's font/antialiasing renders differently, so pixel-diff
        # verification always fails here regardless of code changes.
        run: >
          ./gradlew -q --build-cache :app:testDebugUnitTest ${{ steps.pick.outputs.args }}
          ${{ matrix.shard == 0 && ':app:assembleDebug' || '' }} -ProborazziVerify=false
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ matrix.shard }}
          path: android/app/build/test-results/testDebugUnitTest/*.xml

  # The check `main` protection requires is named `android` — this job keeps that name and
  # passes when every shard passed, or when the change was docs only and the shards were skipped.
  android:
    needs: [changes, android-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} app=${{ needs.changes.outputs.app }} shards=${{ needs.android-shard.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.android-shard.result }}" in
            success) exit 0 ;;
            skipped) [ "${{ needs.changes.outputs.app }}" = "false" ] && exit 0 || exit 1 ;;
            *) exit 1 ;;
          esac
