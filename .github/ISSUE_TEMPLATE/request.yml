name: 남의 파일 고쳐 달라는 요청
description: 내 모드 작업에 필요한데 파일 주인이 따로 있을 때 (예 — Model.kt · Director.kt 는 조장)
title: "[요청] "
labels: ["요청"]
body:
  - type: markdown
    attributes:
      value: |
        카톡 대신 여기에 적어 주세요. 열면 **디스코드에 알림이 뜨고**, 고친 커밋에 `fixes #번호` 가 붙으면 **저절로 닫힙니다.**
        파일 주인은 `guidelines/9_역할과_작업.md` 에 있습니다.
        ⚠️ **API 키 · 토큰은 여기에도 붙이지 않습니다.** 이슈는 팀원 모두가 봅니다.

  - type: input
    id: file
    attributes:
      label: 어느 파일 · 어느 자리
      description: 줄 번호까지 적으면 바로 찾습니다
      placeholder: "Model.kt resetStory() · Scenes.kt:264"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 무엇을 바꿔 달라는가
      description: 한 요청에 하나씩. 셋이면 이슈 셋
      placeholder: parentQuestions 를 비우는 시점을 이야기 시작에서 이야기 끝으로 옮겨 주세요
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 왜 — 지금 무엇이 깨지나
      placeholder: 부모 모드에서 질문을 넣고 [같이 만들기]를 누르는 순간 질문이 사라집니다
    validations:
      required: true

  - type: dropdown
    id: blocking
    attributes:
      label: 얼마나 급한가
      options:
        - 막혀서 못 한다
        - 임시로 돌려 두고 있다 (아래에 어떻게)
        - 급하지 않다
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 임시로 어떻게 돌려 두었나
      description: 고쳐지면 지울 코드가 있으면 그 위치. 주인이 고칠 때 같이 지웁니다
      placeholder: CoopScenes.kt stashCoopQuestions() — 비우는 시점이 옮겨지면 지운다
